# ~/.config/pipewire/pipewire.conf.d/50-virtual-sinks.conf
#
# 4 virtuelle lydkanaler. Node-navnene (OSSink, MusicSink, GameSink, CommsSink)
# bruges af OpenDeck-profilen og lydstyrke.sh – beskrivelserne er det, KDE viser.
#
#   OSSink    = System
#   MusicSink = Musik
#   GameSink  = Spil
#   CommsSink = Kommunikation
#
# Playback-delen har intet target.object, så kanalerne følger altid
# standard-outputtet (Højtalere/Headset fra addons/audio).
# priority.session = 100 sikrer at en kanal aldrig selv bliver valgt som standard.

context.modules = [
    { name = libpipewire-module-loopback
        args = {
            node.description = "System"
            capture.props = { media.class = Audio/Sink node.name = "OSSink" node.description = "System" audio.position = [ FL FR ] priority.session = 100 }
            playback.props = { node.name = "OSSink_playback" audio.position = [ FL FR ] stream.dont-remix = true }
        }
    }
    { name = libpipewire-module-loopback
        args = {
            node.description = "Musik"
            capture.props = { media.class = Audio/Sink node.name = "MusicSink" node.description = "Musik" audio.position = [ FL FR ] priority.session = 100 }
            playback.props = { node.name = "MusicSink_playback" audio.position = [ FL FR ] stream.dont-remix = true }
        }
    }
    { name = libpipewire-module-loopback
        args = {
            node.description = "Spil"
            capture.props = { media.class = Audio/Sink node.name = "GameSink" node.description = "Spil" audio.position = [ FL FR ] priority.session = 100 }
            playback.props = { node.name = "GameSink_playback" audio.position = [ FL FR ] stream.dont-remix = true }
        }
    }
    { name = libpipewire-module-loopback
        args = {
            node.description = "Kommunikation"
            capture.props = { media.class = Audio/Sink node.name = "CommsSink" node.description = "Kommunikation" audio.position = [ FL FR ] priority.session = 100 }
            playback.props = { node.name = "CommsSink_playback" audio.position = [ FL FR ] stream.dont-remix = true }
        }
    }
]
