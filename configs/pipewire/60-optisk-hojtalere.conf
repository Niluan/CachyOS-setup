# ~/.config/pipewire/pipewire.conf.d/60-optisk-hojtalere.conf
#
# Opretter "Højtalere" som en selvstændig lydenhed på bundkortets optiske
# udgang (SPDIF OUT -> EDIFIER M90 optisk input).
# M90 skal stå på optisk input (tryk på VOLUME/SOURCE-knappen for at skifte).
#
# Bundkortets analoge del (grønt stik -> Arctis basestation) styres
# separat af WirePlumber, så begge udgange kan bruges samtidig.

context.objects = [
    {   factory = adapter
        args = {
            factory.name     = api.alsa.pcm.sink
            node.name        = "hojtalere_optisk"
            node.description = "Højtalere"
            node.nick        = "Højtalere"
            media.class      = "Audio/Sink"
            api.alsa.path    = "iec958:CARD=Generic,DEV=0"
            audio.format     = "S16LE"
            audio.rate       = 48000
            audio.channels   = 2
            audio.position   = [ FL FR ]
            priority.session = 2000
            # Større buffer mod knas/skratten på den optiske udgang
            api.alsa.period-size = 1024
            api.alsa.headroom    = 1024
            # Hold udgangen åben, så højtalerne ikke går i standby eller
            # klipper starten af lyde af, når der har været stille.
            session.suspend-timeout-seconds = 0
        }
    }
]
