# ~/.config/wireplumber/wireplumber.conf.d/51-lyd-setup.conf
#
# Lydopsætning:
#   Højtalere  -> bundkortets optiske udgang (SPDIF) -> EDIFIER M90
#                 (oprettes af pipewire/60-optisk-hojtalere.conf)
#   Headset    -> bundkortets grønne stik (LINE OUT) -> aux -> Arctis basestation
#   Mikrofon   <- Arctis headset via Bluetooth (HFP)
#
# - Bundkortet (Strix X570-E) låses i analog stereo-profil
# - Den analoge udgang hedder "Headset" i KDE og OpenDeck
# - Arctis låses i HFP, og Bluetooth-udgangen bliver aldrig standard
# - Bluetooth-mikrofonen bliver automatisk standard-input

wireplumber.settings = {
    bluetooth.autoswitch-to-headset-profile = false
}

monitor.alsa.rules = [
    # Bundkortet: kun analog stereo (Line out -> basestation).
    # Den optiske udgang holdes udenfor profilen, så den kan bruges
    # separat til højtalerne.
    {
        matches = [ { device.name = "alsa_card.pci-0000_0d_00.4" } ]
        actions = {
            update-props = {
                device.profile       = "output:analog-stereo"
                api.acp.auto-profile = false
            }
        }
    }
    {
        matches = [ { node.name = "~alsa_output.pci-0000_0d_00.4.*" } ]
        actions = {
            update-props = {
                node.description = "Headset"
                node.nick        = "Headset"
                priority.session = 1900
            }
        }
    }
]

monitor.bluez.rules = [
    {
        matches = [ { device.description = "~.*Arctis.*" } ]
        actions = {
            update-props = {
                device.profile = "headset-head-unit"
            }
        }
    }
    {
        matches = [ { node.name = "~bluez_output.*" } ]
        actions = {
            update-props = {
                priority.session = 1
                priority.driver  = 1
            }
        }
    }
    {
        matches = [ { node.name = "~bluez_input.*" } ]
        actions = {
            update-props = {
                priority.session = 3000
            }
        }
    }
]
